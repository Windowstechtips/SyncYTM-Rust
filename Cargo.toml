[package]
name = "syncytm-native"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI Framework
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

# HTTP & WebSockets
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["native-tls", "connect"] }
futures-util = "0.3"
url = "2.5"

# Audio Playback
cpal = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Discord Rich Presence
discord-rich-presence = "0.2"

# Utilities
crossbeam-channel = "0.5"
html-escape = "0.2"
urlencoding = "2.1"
